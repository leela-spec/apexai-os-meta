schema: transcript-pipeline-source-decision-evidence.v2
created: '2026-08-18'
status: CURRENT_CONTEXT_RECORD
purpose: >-
  Preserve the operator decisions, prior project-resource inputs, repository
  evidence, hardware facts, and current official external-source references that
  drove V2. This file records reproducible rationale and decision logic; it is
  not a dump of private scratch reasoning.

operator_decisions:
  product:
    final_goal: trustworthy_high_value_knowledge_artifact
    asr_dependency: 'High-quality transcription is required to enable the knowledge goal; ASR is not itself the final product.'
    representation: 'Macro/Meso/Micro is preferred but replaceable if a better representation wins measured comparison.'
  semantic_intelligence:
    allowed_workers:
      - Claude Code CLI
      - Codex CLI
      - Gemini CLI
      - browser subscription AIs
    qwen_current_pipeline_role: none
    qwen_future_possible_role: 'Very simple bounded classification/routing only if independently benchmarked; not semantic reasoning.'
  cost:
    subscription_quota_use: acceptable_quality_first
    deterministic_token_saving_tools: strongly_valuable
    paid_api: undesirable_not_forbidden
    paid_api_visibility: 'Keep useful paid options visible with cost/value; small capped experiments allowed for architecture questions.'
  orchestration:
    normal_trigger: APEX/OpenClaw
    human_interaction: 'No routine intervention after start; fail/stop on genuine unresolved failure/authority boundary.'
  provenance:
    factual_micro_exact_source_evidence_required: true
    all_micro_exact_quote_required: false
    nonfactual_objects_still_need_source_provenance: true
    source_support_separate_from_external_truth: true
    external_verification: important_checkworthy_factual_claims_only
  architecture_policy:
    guard_against_overengineering: true
    focus_on_valuable_target_each_step: true
    measure_before_remove: true
    reuse_before_invention: true
    complexity_definition: 'Complexity without demonstrated value is over-engineering; isolated complexity that materially improves quality/reliability/efficiency or removes fragile custom logic is acceptable.'

provisional_recommended_defaults_from_saved_evaluation:
  status: 'Use as bake-off defaults, not final production-selection authority.'
  A_measure_before_remove: A1_yes
  B_speaker_identity: B1_yes_when_multi_speaker
  C_langextract_real_benchmark: C1_yes
  D_local_preextract: D1_gliner2_first_then_nuextract_if_needed
  E_nli_hhem_advisory: E1_yes
  F_docetl_real_benchmark: F1_yes
  G_small_capped_api_experiment: G1_yes_if_material_and_recorded
  H_deepeval_plus_gold_scoreboard: H1_yes
  I_fabric_open_notebook_baselines: I1_yes
  J_isolated_dependency_for_material_gain: J1_yes
  note: >-
    The operator asked to save and operationalize the corrected architecture;
    these defaults therefore define the benchmark scope. They do not preselect
    winners. Task P16 promotes/rejects components from evidence.

project_resource_inputs:
  - title: Evaluate pipelines.txt
    role: 'Saved corrected architecture V2 and Q&A/reuse-bakeoff rationale.'
    key_points:
      - 'Do not conflate not-all-in-hot-path with exclude-all-components.'
      - 'faster-whisper core/reference; Parakeet challenger; WhisperX conditional.'
      - 'TTK core custody; LangExtract real grounded Map contender; Instructor conditional; DocETL orchestration contender.'
      - 'GLiNER2 cheap local pre-extraction; NuExtract secondary challenger.'
      - 'mDeBERTa/HHEM advisory safety; DeepEval benchmark/eval; Fabric/Open Notebook baselines.'
      - 'Measure candidates, then remove losers with evidence.'
  - title: AI validation handover.txt
    role: 'Broader APEX/FEE authority and deterministic-vs-semantic design background.'
  - title: HP HP OmniBook X Flip Laptop 16-as0xxx - Geekbench cpu 2.html
    role: 'Local hardware evidence.'
  - title: HP HP OmniBook X Flip Laptop 16-as0xxx - Geekbench gpu2.html
    role: 'Local GPU/OpenCL hardware evidence.'
  - title: HP HP OmniBook X Flip Laptop 16-as0xxx - Geekbench cpu BM6.html
    role: 'Additional CPU benchmark evidence.'
  - title: HP HP OmniBook X Flip Laptop 16-as0xxx - Geekbench gpu BM 6.html
    role: 'Additional GPU benchmark evidence.'

