  current_semantic_contract:
    path: .claude/skills/transcript-to-knowledge/references/semantic-contracts.md
    known_update_required: 'Operator D35 factual-only hard exact-quote requirement versus current every-candidate-claim quote requirement.'
  current_failure_file:
    path: .claude/skills/transcript-to-knowledge/scripts/execute_ttk_lifecycle.py
    failure_class: pseudo_semantic_heuristics
    examples:
      - keyword_claim_classification
      - regex_entity_extraction
      - source_sentence_fragments_as_claims
      - fixed_Meso_grouping
      - generic_Macro
      - blanket_source_support
  latest_known_benchmark_receipt:
    path: artifacts/benchmark_runs/20260818-185245/receipt.json
    important_state:
      all_passed: false
      fully_complete_sources: 1
      incomplete_sources: 3
      note: 'Run provenance recorded dirty tree/prior commit; V2 requires stronger start/end provenance.'

