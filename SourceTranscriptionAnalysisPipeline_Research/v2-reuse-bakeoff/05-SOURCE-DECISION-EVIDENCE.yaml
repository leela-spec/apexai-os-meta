external_primary_sources:
  - id: faster_whisper
    url: 'https://github.com/SYSTRAN/faster-whisper'
    evidence_used: 'local ASR, word timestamps, VAD, probability/segment diagnostics/hotword capabilities'
  - id: parakeet
    url: 'https://huggingface.co/nvidia/parakeet-tdt-0.6b-v3'
    evidence_used: 'multilingual 600M ASR including English/German and timestamp support'
  - id: whisperx
    url: 'https://github.com/m-bain/whisperX'
    evidence_used: 'faster-whisper backend, forced alignment, pyannote speaker diarization'
  - id: langextract
    url: 'https://github.com/google/langextract'
    evidence_used: 'precise source grounding, structured extraction, long-doc strategy, local/cloud providers'
  - id: langextract_provider_plugin
    url: 'https://github.com/google/langextract/blob/main/examples/custom_provider_plugin/README.md'
    evidence_used: 'official external provider plugin and optional schema mechanism'
  - id: gliner2
    url: 'https://github.com/fastino-ai/GLiNER2'
    evidence_used: '205M CPU-first local entities/classification/relations/structured extraction'
  - id: docetl
    url: 'https://github.com/ucbepic/docetl'
    evidence_used: 'declarative/agentic Map-Reduce, operators, parallelism, optimization'
  - id: deepeval
    url: 'https://github.com/confident-ai/deepeval'
    evidence_used: 'repeatable faithfulness/hallucination/relevancy/G-Eval-style evaluation framework'
  - id: hhem
    url: 'https://huggingface.co/vectara/hallucination_evaluation_model'
    evidence_used: 'local factual-consistency/hallucination comparison model'
  - id: claude_cli
    url: 'https://code.claude.com/docs/en/cli-usage'
    evidence_used: 'headless print mode, JSON output, JSON schema, max turns/budget controls'
  - id: codex_cli
    url: 'https://github.com/openai/codex/blob/main/codex-rs/exec/src/cli.rs'
    evidence_used: 'codex exec output schema, JSONL and final-message output controls'
  - id: gemini_cli
    url: 'https://github.com/google-gemini/gemini-cli/blob/main/docs/cli/headless.md'
    evidence_used: 'headless JSON/stream JSON, usage stats, exit codes'

rationale_trace:
  - decision: retain_TTK_spine
    because:
      - 'already implements transcript-specific deterministic custody/resume/validation'
      - 'generic alternatives do not automatically preserve core/context evidence semantics'
  - decision: benchmark_LangExtract
    because:
      - 'precise source grounding is directly relevant to current quote/span weakness'
      - 'custom provider is officially supported, so subscription-CLI-backed experiment is feasible'
  - decision: benchmark_GLiNER2
    because:
      - 'local CPU-first narrow extraction could reduce expensive general-AI work'
      - 'its role is auxiliary, so it cannot displace semantic authority accidentally'
  - decision: benchmark_DocETL
    because:
      - 'it directly targets long-document LLM Map/Reduce orchestration'
      - 'whether it beats TTK semantic dispatch is empirical, not obvious'
  - decision: benchmark_NLI_and_HHEM
    because:
      - 'quote existence does not prove semantic support'
      - 'cheap independent warnings may catch errors without a second large-model pass'
  - decision: use_DeepEval_as_auxiliary
    because:
      - 'repeatable semantic regression is useful'
      - 'automatic judges do not replace deterministic provenance or multilingual gold'
  - decision: benchmark_Parakeet
    because:
      - 'German/domain ASR errors are already observed'
      - 'a modern multilingual local ASR may solve them more cleanly than transcript repair'
  - decision: conditional_WhisperX
    because:
      - 'speaker attribution has value on interviews'
      - 'mandatory diarization would add needless cost to single-speaker sources'

unresolved_before_execution:
  - 'Exact installed versions/revisions of candidate packages; P5 records them.'
  - 'Whether Parakeet runtime is smooth on this exact Windows/Intel stack.'
  - 'Whether WhisperX diarization model access is already authenticated.'
  - 'Whether LangExtract CLI-provider adapter preserves subscription economics cleanly.'
  - 'Whether DocETL can use the preferred subscription CLI route without disproportionate adapter work; capped API experiment is allowed if materially useful.'
  - 'How much GLiNER2 helps German extraction; benchmark required.'
  - 'Exact utility of NLI/HHEM thresholds; derive from labeled fixtures.'
  - 'Whether DeepEval metrics used are language-appropriate; German must not rely solely on English judge prompts.'

forbidden_inferences:
  - 'Installed means selected.'
  - 'Local means deterministic.'
  - 'Exact quote exists means proposition is supported.'
  - 'Schema valid means semantic quality is good.'
  - 'A simple architecture is best before comparison.'
  - 'A feature-rich architecture is best before comparison.'
  - 'A paid option is forbidden simply because local/free is preferred.'
  - 'A research score is an implementation PASS.'
