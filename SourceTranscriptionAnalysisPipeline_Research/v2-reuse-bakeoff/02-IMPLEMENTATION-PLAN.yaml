      - 'Force fresh transcription into a new V2 run directory; never silently reuse old SRT/JSON.'
      - 'If conditional WhisperX is selected and source is multi-speaker, apply it according to selection policy.'
      - 'Run TTK custody, selected Map/Reduce/advisory/verification, compile, complete validate.'
