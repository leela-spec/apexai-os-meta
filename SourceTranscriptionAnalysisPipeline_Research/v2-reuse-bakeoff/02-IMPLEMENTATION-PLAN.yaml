  - id: P22
    title: Final regression, clean-room resume test, and handover
    depends_on: [P20, P21]
    purpose: 'End with a reproducible test and a handover another AI can trust.'
    writes:
      - artifacts/transcript_pipeline_v2/FINAL-REPORT.yaml
      - SourceTranscriptionAnalysisPipeline_Research/v2-reuse-bakeoff/06-FINAL-HANDOVER.md
      - SourceTranscriptionAnalysisPipeline_Research/00-INDEX.md
    mandatory_test_commands:
      - 'python .claude/skills/transcript-to-knowledge/scripts/test_ttk.py -v'
      - 'python -m unittest discover -s scripts/transcript_pipeline_v2/tests -t . -v'
      - 'powershell -NoProfile -File scripts/Run-BatchMultiPipelineBenchmark.ps1'
      - 'git diff --check'
    clean_room_test:
      - 'Create/copy one completed benchmark run to a safe test location or use a fixture.'
      - 'Delete exactly one derived Map result in the test copy.'
      - 'Run status/runner and prove only that Map plus dependent Reduce/verify/compile artifacts are regenerated as required.'
      - 'Run the same complete run again and prove no valid semantic packet is unnecessarily rerun.'
      - 'Record semantic invocation counts before/after.'
    final_report_schema: transcript-pipeline-final-report.v2
    final_report_required_fields:
      - verdict
      - repository
      - branch
      - start_commit
      - end_commit
      - dirty_paths
      - selected_architecture
      - component_decisions
      - installed_components
      - benchmarked_components
      - unmeasured_components
      - unit_test_results
      - four_source_results
      - fresh_end_to_end_results
      - asr_selection
      - map_selection
      - support_advisory_selection
      - reduce_selection
      - verification_selection
      - product_baseline_results
      - token_runtime_memory_summary
      - hard_gate_failures
      - known_limitations
      - reversal_triggers
      - exact_next_step
    final_verdict_rules:
      PASS:
        - all mandatory tests pass
        - required four-source semantic regression passes
        - required fresh DE+EN end-to-end passes
        - selected components have measured evidence
        - no required stage reports fabricated completion
        - clean-room resume test passes
      PARTIAL:
        - core selected pipeline works but one non-core challenger/baseline is blocked or a declared optional measurement remains unmeasured
      FAIL:
        - any selected pipeline hard gate fails
        - semantic completion cannot be proven
        - fresh required end-to-end source fails without bounded attributable fix
        - deterministic regression suite fails
    commit:
      message: 'docs(transcript): finalize V2 reuse bakeoff handover'

final_execution_instruction: >-
  Do not report the pipeline as complete after installing components or producing
  one attractive output. Completion requires P22's mandatory tests, the
  four-source semantic regression, at least one fresh German and one fresh
  English end-to-end run, and a machine-readable FINAL-REPORT.yaml that makes
  every component selection traceable to benchmark evidence.
