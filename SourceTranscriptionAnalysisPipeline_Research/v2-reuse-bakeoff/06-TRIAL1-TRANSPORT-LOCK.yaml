schema: transcript-pipeline-trial1-transport-lock.v2_1
created: '2026-08-18'
status: AUTHORITATIVE_TRIAL1_OVERRIDE
repository: leela-spec/apexai-os-meta
branch_policy: main_only_unless_operator_explicitly_changes_it
scope: >-
  Trial 1 AI transport and provider policy only. This file does not replace the
  V2 architecture analysis, component registry, benchmark specification, or
  implementation task graph. It overrides any older V2 line that conflicts with
  the Trial 1 transport rules below.

reason_for_file: >-
  Verification of commit c3719abd466427ecfe35f3838f970fd46ec99e6c found that
  the subscription-CLI patch was substantially applied but three contradictory
  historical lines remained: Gemini still appeared as a generic structured-output
  fallback in 01-ARCHITECTURE-ANALYSIS.md; P10 in 02-IMPLEMENTATION-PLAN.yaml still
  allowed a small capped API experiment for DocETL; and P13 still listed a hosted
  ASR oracle as a Trial 1 optional candidate. This lock resolves those conflicts
  explicitly while preserving the researched post-Trial-1 options.

authority:
  applies_to: trial1_only
  precedence_within_v2:
    - current_explicit_operator_instruction
    - SourceTranscriptionAnalysisPipeline_Research/v2-reuse-bakeoff/06-TRIAL1-TRANSPORT-LOCK.yaml
    - SourceTranscriptionAnalysisPipeline_Research/v2-reuse-bakeoff/00-START-HERE.md
    - SourceTranscriptionAnalysisPipeline_Research/v2-reuse-bakeoff/02-IMPLEMENTATION-PLAN.yaml
    - SourceTranscriptionAnalysisPipeline_Research/v2-reuse-bakeoff/03-BENCHMARK-AND-TEST-SPEC.yaml
    - SourceTranscriptionAnalysisPipeline_Research/v2-reuse-bakeoff/04-COMPONENT-REGISTRY.yaml
    - SourceTranscriptionAnalysisPipeline_Research/v2-reuse-bakeoff/01-ARCHITECTURE-ANALYSIS.md
    - older_research_and_history
  conflict_rule: >-
    If any V2 file permits a Trial 1 AI transport forbidden here, this file wins
    and the forbidden route must be recorded as POST_TRIAL_ONLY or
    BLOCKED_FOR_TRIAL1 rather than executed.

trial1:
  semantic_transport: subscription_cli_only
  allowed_semantic_workers:
    - id: claude_code
      command_family: claude
      status: ALLOWED
      authentication_intent: Claude_subscription_or_account_session
      notes:
        - sanitize conflicting API-key routing variables in child processes
        - record transport class, never credentials
    - id: codex_cli
      command_family: codex
      status: ALLOWED
      authentication_intent: ChatGPT_plan_sign_in
      notes:
        - record transport class, never credentials
    - id: antigravity_cli
      command_family: agy
      status: CONDITIONAL_ALLOWED
      authentication_intent: Google_account_subscription_or_account_session
      prerequisite: local_headless_subprocess_smoke_pass
      smoke_requirements:
        - noninteractive_prompt_execution
        - capturable_final_output
        - bounded_timeout
        - clean_exit
        - no_api_key_billing
      on_failure: BLOCKED_FOR_TRIAL1

  deferred_semantic_workers:
    - id: gemini_cli
      status: POST_TRIAL_ONLY
      reason: operator_selected_Claude_Codex_Antigravity_for_first_trial
    - id: browser_subscription_ai
      status: POST_TRIAL_ONLY
      reason: first_trial_must_be_local_CLI_invoked

  forbidden_ai_transports:
    - api_key_billing
    - pay_as_you_go_model_api
    - direct_Anthropic_API
    - direct_OpenAI_API
    - direct_Gemini_API
    - Vertex_AI_model_API
    - hosted_model_API
    - browser_AI_automation

  framework_rule: >-
    A reusable framework that needs strong AI may participate in Trial 1 only if
    its AI call is routed through Claude Code CLI, Codex CLI, or smoke-tested
    Antigravity CLI using a bounded local adapter. If that is not practical, the
    framework is BLOCKED_FOR_TRIAL1. Do not silently substitute an API provider.

  external_verification_rule: >-
    Verify only important/checkworthy factual claims. Trial 1 verification may
    use capabilities exposed through an allowed subscription CLI. If the required
    verification cannot be performed through an allowed CLI, leave the external
    verdict UNVERIFIED or mark the verification route BLOCKED_FOR_TRIAL1. Do not
    fall back to browser AI or paid API transport during Trial 1.

  deepeval_rule: >-
    DeepEval remains an evaluation framework, not a semantic authority. Any
    LLM-backed metric in Trial 1 must use an allowed subscription-CLI adapter. If
    this is impractical, record that metric BLOCKED_FOR_TRIAL1 or UNMEASURED.

  docetl_rule: >-
    DocETL remains a real orchestration challenger. The first fixed-pipeline test
    keeps its optimizer OFF. If DocETL cannot use an allowed subscription CLI
    without disproportionate adapter work, record DocETL BLOCKED_FOR_TRIAL1. A
    capped API experiment is explicitly forbidden in Trial 1.

  hosted_asr_rule: >-
    Hosted ASR/oracle services remain documented future options but are not Trial
    1 candidates. Trial 1 ASR comparison is local: faster-whisper configurations,
    Parakeet, and other explicitly local challengers already defined by V2.

known_conflicts_resolved_by_this_lock:
  - file: SourceTranscriptionAnalysisPipeline_Research/v2-reuse-bakeoff/01-ARCHITECTURE-ANALYSIS.md
    location_semantics: S8_structured_output_retry_layer
    stale_text_meaning: Gemini_headless_JSON_as_generic_fallback_challenger
    authoritative_interpretation: Gemini_CLI_is_POST_TRIAL_ONLY
  - file: SourceTranscriptionAnalysisPipeline_Research/v2-reuse-bakeoff/02-IMPLEMENTATION-PLAN.yaml
    task: P10
    stale_text_meaning: DocETL_may_use_small_capped_API_experiment
    authoritative_interpretation: DocETL_API_route_is_FORBIDDEN_IN_TRIAL1_and_must_be_BLOCKED_FOR_TRIAL1_if_CLI_adapter_is_not_practical
  - file: SourceTranscriptionAnalysisPipeline_Research/v2-reuse-bakeoff/02-IMPLEMENTATION-PLAN.yaml
    task: P13
    stale_text_meaning: hosted_asr_oracle_is_optional_Trial1_candidate
    authoritative_interpretation: hosted_asr_oracle_is_POST_TRIAL_ONLY

post_trial_options_preserved:
  rule: >-
    Do not delete useful paid/API/browser options from the research record. They
    remain visible for later operator decisions after Trial 1, but Trial 1 results
    may not silently promote or execute them.
  examples:
    - hosted_ASR_oracle
    - paid_research_API
    - browser_subscription_AI
    - Gemini_CLI
    - DocETL_API_provider_experiment

trial1_selection_gate:
  allowed_selected_semantic_route_classes:
    - Claude_Code_subscription_CLI
    - Codex_subscription_CLI
    - Antigravity_CLI_after_smoke_PASS
  forbidden_selected_semantic_route_classes:
    - API_key_billed
    - pay_as_you_go
    - hosted_model_API
    - browser_AI
    - Gemini_CLI
  local_nonsemantic_components: allowed_if_their_own_benchmark_gates_pass

verification_status_at_creation:
  inspected_remote_branch: main
  inspected_commit: c3719abd466427ecfe35f3838f970fd46ec99e6c
  patch_commit_message: 'docs(transcript): restrict Trial 1 to subscription CLI transport'
  findings:
    patched_correctly:
      - START_HERE_Trial1_transport_policy
      - architecture_hosted_ASR_deferred
      - architecture_Map_route_Claude_Codex_Antigravity
      - architecture_DocETL_fail_closed_policy
      - architecture_external_verification_Trial1_CLI_only
      - implementation_EX11_EX12_EX13
      - implementation_P0_CLI_and_environment_checks
      - implementation_P4_provider_order_and_Antigravity_smoke
      - implementation_P16_selection_rule
      - benchmark_Trial1_transport_principles
      - benchmark_hosted_ASR_post_trial_classification
      - benchmark_DeepEval_CLI_only_rule
      - component_registry_REG08_REG09
      - component_registry_Claude_Codex_Antigravity_provider_registry
      - component_registry_DocETL_Trial1_policy
      - component_registry_verification_provider_split
      - source_decision_evidence_Trial1_lock
    residual_conflicts_overridden_here:
      - architecture_S8_Gemini_fallback_wording
      - implementation_P10_capped_API_wording
      - implementation_P13_hosted_ASR_optional_wording

completion_rule: >-
  Trial 1 is compliant only if execution receipts prove every strong-AI call used
  an allowed subscription CLI transport and no forbidden transport was used.