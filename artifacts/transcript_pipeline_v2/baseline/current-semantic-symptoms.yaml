schema: transcript-pipeline-semantic-symptoms.v2
recorded_at: '2026-08-18'
baseline_source: execute_ttk_lifecycle.py
status: OBSERVED_FAILURE_EVIDENCE

symptoms:
  - id: SYM-01
    name: generic_macro_thesis_and_summary_boilerplate
    description: >
      Macro thesis and summary are template-formatted strings that insert the source
      title and segment count without real semantic synthesis.
    concrete_examples:
      - source: CygwqaNg2PY
        file: artifacts/ttk_runs/CygwqaNg2PY/work/results/reduce.json
        observed_thesis: "Comprehensive empirical and thematic knowledge extraction from 'Elliott Prechter: Teaching a Machine to Count Elliott Waves'."
        observed_summary: "Hierarchical synthesis covering 215 segments across 4 Map windows into 2 modular deep dives and 16 forensic claims."
      - source: vFTuLylvYnA
        file: artifacts/ttk_runs/vFTuLylvYnA/work/results/reduce.json
        observed_thesis: "Comprehensive empirical and thematic knowledge extraction from 'Tech unter Druck. Zinsen werden zum Risiko - Markus Koch'."

  - id: SYM-02
    name: fixed_mechanical_meso_grouping
    description: >
      Meso modules are mechanically generated by dividing windows into 2 to 4 fixed
      hardcoded titles rather than deriving true semantic chapter boundaries.
    hardcoded_chapter_titles:
      - "Foundational Architecture & Context"
      - "Mechanisms, Evidence & Analysis"
      - "Strategic Implications & Decision Framework"
      - "Synthesis, Caveats & Forward Outlook"
    concrete_examples:
      - source: P-h5WSQG1Sw
        file: artifacts/ttk_runs/P-h5WSQG1Sw/work/results/reduce.json
        observed_meso_modules:
          - "Foundational Architecture & Context `[00:00:00 - 00:27:01]`"
          - "Mechanisms, Evidence & Analysis `[00:27:01 - 00:56:23]`"
          - "Strategic Implications & Decision Framework `[00:56:23 - 01:24:59]`"
          - "Synthesis, Caveats & Forward Outlook `[01:25:00 - 02:09:21]`"

  - id: SYM-03
    name: conversational_sentence_fragments_dumped_as_claims
    description: >
      Candidate claims in Map/Reduce are generated by taking raw transcript sentences
      without proposition filtering, resulting in greeting phrases and sentence fragments
      treated as high-checkworthiness factual claims.
    concrete_examples:
      - source: oZIsMX6WgFs
        claim_ref: micro-001
        claim_text: "Thanks for joining today."
        claim_kind: fact
        checkworthiness: high
      - source: CygwqaNg2PY
        claim_ref: micro-001
        claim_text: "Elliott, thanks for joining us today, so we have Elliott Pregnant with us, and it's an honor to"
        claim_kind: fact
        checkworthiness: high

  - id: SYM-04
    name: regex_pseudo_entities
    description: >
      Proper nouns are extracted via regex `[A-Z][a-z]+` without semantic validation,
      extracting arbitrary capitalized words as topics/entities.
    concrete_examples:
      - source: oZIsMX6WgFs
        entities: ["Thanks", "From", "Lars Fartinen"]
      - source: vFTuLylvYnA
        entities: ["Morgen", "Druck", "Punkte"]

  - id: SYM-05
    name: blanket_source_support_without_entailment
    description: >
      All micro claims in the baseline reduce result are stamped `source_support: SUPPORTED`
      unconditionally because a verbatim quote exists in the segment, ignoring actual semantic entailment.
    concrete_examples:
      - source: P-h5WSQG1Sw
        micro_claims_total: 92
        supported_count: 92
        unsupported_count: 0
        partial_count: 0
        rule_violation: "Quote existence does not imply semantic support (HG06 violation)."
