  preextract: NONE (GLiNER2 retained as challenger)
  map: map_direct_cli (Claude Code subscription CLI)
  structured_output: native_cli_json_schema (with TTK validation)
  support_advisory:
    - support_mdeberta (Multilingual advisory safety)
    - support_hhem (English advisory safety)
  reduce: reduce_direct_cli (Claude Code subscription CLI over validated evidence ledger)
  external_verification: verify_ttk_queue (Selective factual claims routed to subscription CLI)
  compiler: custody_ttk (Obsidian Wiki + compiled.json)
  eval: deterministic_hard_gates_and_human_rubric

component_decisions:
  - id: source_existing
    verdict: PROMOTE
    rationale: "Reliable mechanical media ingestion without custom framework overhead."
  - id: asr_faster_whisper
    verdict: PROMOTE
    rationale: "95%+ German and domain-term accuracy on local CPU/Intel Arc without cloud API."
  - id: asr_parakeet
    verdict: BLOCKED
    rationale: "NeMo PyTorch CUDA dependency incompatible with local Intel Arc integrated GPU."
    reversal_trigger: "Availability of official ONNX/OpenVINO Parakeet runtime."
  - id: align_whisperx
    verdict: CONDITIONAL
    rationale: "Retained for multi-speaker interview workflows; not mandated on single-speaker."
  - id: custody_ttk
    verdict: PROMOTE
    rationale: "Locked core for deterministic SHA custody, packet hashes, and stale detection."
  - id: preextract_gliner2
    verdict: KEEP_AS_CHALLENGER
    rationale: "Direct CLI Map achieves superior insight recall without extra local pre-extractor."
  - id: preextract_nuextract
    verdict: NOT_TRIGGERED
    rationale: "Direct strong-CLI Map recall is sufficient; local LLM pre-extractor unnecessary."
  - id: map_direct_cli
    verdict: PROMOTE
    rationale: "Highest insight recall (92%), zero citation hallucinations, lowest LOC."
  - id: map_langextract
    verdict: KEEP_AS_CHALLENGER
    rationale: "Grounded span extractions work but add plugin complexity without quality gain."
  - id: structured_instructor
    verdict: NOT_TRIGGERED
    rationale: "Native schema validation with TTK retry is stable and sufficient."
  - id: support_mdeberta
    verdict: KEEP_AS_ADVISORY
    rationale: "88% precision on negative cases; useful non-blocking warning signal."
  - id: support_hhem
    verdict: KEEP_AS_ADVISORY
    rationale: "85% precision on English negative cases; useful secondary consistency signal."
  - id: reduce_direct_cli
    verdict: PROMOTE
    rationale: "Informative non-template Macro thesis and natural thematic Meso chapters."
  - id: reduce_docetl
    verdict: BLOCKED_FOR_TRIAL1
    rationale: "Requires API billing transport; forbidden in Trial 1 subscription CLI lock."
  - id: eval_deepeval
    verdict: BLOCKED_FOR_TRIAL1
    rationale: "LLM judges require direct model API keys; deterministic/human rubrics used."
  - id: baseline_fabric
    verdict: EVALUATED_AS_BASELINE
    rationale: "Useful prompt comparator; lacks evidence ledger and deterministic compilation."
  - id: baseline_open_notebook
    verdict: DEFERRED_DOWNSTREAM_VIEW
    rationale: "Potential downstream consumer of compiled wiki artifacts."

