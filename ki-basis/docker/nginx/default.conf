server {
    listen 80;
    server_name localhost 127.0.0.1;

    # Edge healthcheck endpoint
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ki-basis nginx edge proxy healthy\n';
    }

    # Stack index page
    location = / {
        add_header Content-Type text/html;
        return 200 '<!DOCTYPE html><html><head><title>ki-basis Platform</title><style>body{font-family:system-ui,sans-serif;padding:2rem;background:#0f172a;color:#f8fafc;}a{color:#38bdf8;text-decoration:none;}li{margin:0.75rem 0;}ul{list-style:none;padding:0;}</style></head><body><h1>ki-basis Platform Edge</h1><ul><li><a href="http://127.0.0.1:8086">Firefly III (Finance) — :8086</a></li><li><a href="http://127.0.0.1:8010">Paperless-ngx (Documents) — :8010</a></li><li><a href="http://127.0.0.1:8082">OpenProject (Projects) — :8082</a></li><li><a href="http://127.0.0.1:8642">Hermes Dashboard (AI) — :8642</a></li></ul></body></html>\n';
    }
}