server {
    listen 8082;
    server_name localhost 127.0.0.1;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ki-basis tools healthy\n';
    }
    location = /tools/asn-labels {
        return 301 /tools/asn-labels/;
    }
    location /tools/asn-labels/ {
        alias /usr/share/nginx/asn-labels/;
        index index.html;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
