# Shared-Postgres variant of the private stack — drops the local `postgres`
# service; firefly/paperless join the external shared-db-net cluster instead.
# Companion to compose.yaml (kept as rollback reference).
# nginx/valkey/hermes stay on ki-basis-net only, same as before.
#
# Deliberately has NO `openproject` service. `ki-basis-openproject` is the
# retired v14 duplicate (D-05, meant to stay stopped) -- NOT the authoritative
# private OpenProject. The real one is leela-op178-openproject, a separate
# compose project with its own compose.shared-db.yaml. Including this service
# here once caused a real incident: it resurrected the stopped v14 container
# and pointed its old-version migrations at priv_openproject's already-17.8
# restored schema, crash-looping on "table already exists". Do not re-add it.
#
# Usage (from WSL2 Apex engine, cwd = this file's directory):
#   docker compose -f compose.shared-db.yaml --env-file .env.shared-db -p ki-basis up -d
name: ${COMPOSE_PROJECT_NAME:-ki-basis}

networks:
  ki-basis-net:
    name: ${KI_NETWORK_NAME:-ki-basis-net}
    driver: bridge
  shared-db-net:
    external: true

volumes:
  valkey_data:
    name: ${COMPOSE_PROJECT_NAME:-ki-basis}-valkey-data
  firefly_upload:
    name: ${COMPOSE_PROJECT_NAME:-ki-basis}-firefly-upload
  paperless_data:
    name: ${COMPOSE_PROJECT_NAME:-ki-basis}-paperless-data
  paperless_media:
    name: ${COMPOSE_PROJECT_NAME:-ki-basis}-paperless-media
  paperless_export:
    name: ${COMPOSE_PROJECT_NAME:-ki-basis}-paperless-export
  paperless_consume:
    name: ${COMPOSE_PROJECT_NAME:-ki-basis}-paperless-consume
services:
  valkey:
    image: valkey/valkey@sha256:f110e5df168de4cdbd17afec848c6efe88e4b5e51c5b1ec6109de0c1b6a0c60b
    container_name: ${COMPOSE_PROJECT_NAME:-ki-basis}-valkey
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1", "--loglevel", "notice"]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - ki-basis-net

  firefly:
    image: fireflyiii/core@sha256:ae69fdd95cdef9038cd7a460a5aec731f14813973e4f096511d5a4ea9ff0e972
    container_name: ${COMPOSE_PROJECT_NAME:-ki-basis}-firefly
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FIREFLY_HOST_PORT:-8086}:8080"
    environment:
      APP_KEY: ${FIREFLY_APP_KEY:?FIREFLY_APP_KEY is required}
      APP_URL: http://127.0.0.1:${FIREFLY_HOST_PORT:-8086}
      APP_ENV: local
      APP_DEBUG: "false"
      SITE_OWNER: admin@example.com
      TZ: Europe/Berlin
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${FIREFLY_DB_NAME:-priv_firefly}
      DB_USERNAME: ${FIREFLY_DB_USER:-priv_firefly_app}
      DB_PASSWORD: ${FIREFLY_DB_PASSWORD:?FIREFLY_DB_PASSWORD is required}
    volumes:
      - firefly_upload:/var/www/html/storage/upload
    networks:
      - ki-basis-net
      - shared-db-net

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx@sha256:5ab4f4f9bb099a36bec3e092906ea3e611323c5f18dc5cc38c76a1d540bdca9c
    container_name: ${COMPOSE_PROJECT_NAME:-ki-basis}-paperless
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PAPERLESS_HOST_PORT:-8010}:8000"
    environment:
      PAPERLESS_REDIS: redis://valkey:6379
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: postgres
      PAPERLESS_DBPORT: 5432
      PAPERLESS_DBNAME: ${PAPERLESS_DB_NAME:-priv_paperless}
      PAPERLESS_DBUSER: ${PAPERLESS_DB_USER:-priv_paperless_app}
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD:?PAPERLESS_DB_PASSWORD is required}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?PAPERLESS_SECRET_KEY is required}
      PAPERLESS_URL: http://127.0.0.1:${PAPERLESS_HOST_PORT:-8010}
      PAPERLESS_TIME_ZONE: Europe/Berlin
      PAPERLESS_OCR_LANGUAGE: deu+eng
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:-admin}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:?PAPERLESS_ADMIN_PASSWORD is required}
    volumes:
      - paperless_data:/usr/src/paperless/data
      - paperless_media:/usr/src/paperless/media
      - paperless_export:/usr/src/paperless/export
      - paperless_consume:/usr/src/paperless/consume
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "-S", "--max-time", "2", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ki-basis-net
      - shared-db-net

  nginx:
    image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: ${COMPOSE_PROJECT_NAME:-ki-basis}-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NGINX_HOST_PORT:-8084}:80"
    volumes:
      - ./docker/nginx:/etc/nginx/conf.d:ro
    depends_on:
      - firefly
      - paperless
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - ki-basis-net

  hermes:
    image: nousresearch/hermes-agent@sha256:09d743f5e012e41503829d06ca129c7d3e87ea3f943f7228d520c5c53c6f7db5
    container_name: ${COMPOSE_PROJECT_NAME:-ki-basis}-hermes
    restart: unless-stopped
    command: gateway run
    ports:
      - "127.0.0.1:${HERMES_GATEWAY_HOST_PORT:-8642}:8642"
      - "127.0.0.1:${HERMES_DASHBOARD_HOST_PORT:-9119}:9119"
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_GATEWAY_EXTERNAL_SUPERVISOR: "1"
      HERMES_GATEWAY_BOOTSTRAP_STATE: "running"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-admin}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:?HERMES_DASHBOARD_BASIC_AUTH_PASSWORD is required}
      HERMES_HOME: /opt/data
      HERMES_WRITE_SAFE_ROOT: /opt/data
      HERMES_DISABLE_LAZY_INSTALLS: "1"
      HERMES_LAZY_INSTALL_TARGET: /opt/data/lazy-packages
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_KEY: ${HERMES_API_SERVER_KEY:?HERMES_API_SERVER_KEY is required}
      FIREFLY_API_URL: http://firefly:8080
      PAPERLESS_API_URL: http://paperless:8000
      # Phase 7: re-wired to the authoritative 17.8 instance (leela-op178-openproject),
      # replacing the dead retired-v14 reference. Targets the CONTAINER NAME, not a
      # generic "openproject" alias -- avoids repeating the D-17 alias-collision
      # incident if the old v14 duplicate is ever (mistakenly) started again.
      OPENPROJECT_API_URL: http://leela-op178-openproject:80
      OPENPROJECT_KEY: ${OPENPROJECT_API_KEY:?OPENPROJECT_API_KEY is required}
    volumes:
      # Matches the LIVE container's actual mounts (bind, not named volumes) --
      # the checked-in compose.yaml drifted from this some time after the
      # container was created 2026-09-01; using named volumes here would make
      # Compose recreate hermes onto fresh EMPTY volumes and wipe its real state
      # at /root/.hermes and /root/workspaces on the WSL2 filesystem. See D-16.
      - /root/.hermes:/opt/data
      - /root/workspaces:/root/workspaces
    depends_on:
      - firefly
      - paperless
      - nginx
    networks:
      - ki-basis-net
