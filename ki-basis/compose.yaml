name: ki-basis

networks:
  ki-basis-net:
    name: ${KI_NETWORK_NAME:-ki-basis-net}
    driver: bridge

volumes:
  postgres_data:
    name: ki-basis-postgres-data
  valkey_data:
    name: ki-basis-valkey-data
  firefly_upload:
    name: ki-basis-firefly-upload
  paperless_data:
    name: ki-basis-paperless-data
  paperless_media:
    name: ki-basis-paperless-media
  paperless_export:
    name: ki-basis-paperless-export
  paperless_consume:
    name: ki-basis-paperless-consume
  openproject_data:
    name: ki-basis-openproject-data
  openproject_assets:
    name: ki-basis-openproject-assets

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ki-basis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_placeholder_password}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      FIREFLY_DB_USER: ${FIREFLY_DB_USER:-firefly_app}
      FIREFLY_DB_PASSWORD: ${FIREFLY_DB_PASSWORD:-firefly_secure_placeholder_password}
      FIREFLY_DB_NAME: ${FIREFLY_DB_NAME:-firefly}
      PAPERLESS_DB_USER: ${PAPERLESS_DB_USER:-paperless_app}
      PAPERLESS_DB_PASSWORD: ${PAPERLESS_DB_PASSWORD:-paperless_secure_placeholder_password}
      PAPERLESS_DB_NAME: ${PAPERLESS_DB_NAME:-paperless}
      OPENPROJECT_DB_USER: ${OPENPROJECT_DB_USER:-openproject_app}
      OPENPROJECT_DB_PASSWORD: ${OPENPROJECT_DB_PASSWORD:-openproject_secure_placeholder_password}
      OPENPROJECT_DB_NAME: ${OPENPROJECT_DB_NAME:-openproject}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ki-basis-net

  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: ki-basis-valkey
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1", "--loglevel", "notice"]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - ki-basis-net

  firefly:
    image: fireflyiii/core:latest
    container_name: ki-basis-firefly
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FIREFLY_HOST_PORT:-8086}:8080"
    environment:
      APP_KEY: ${FIREFLY_APP_KEY:-SomeRandomStringOf32CharsExact!!}
      APP_URL: http://127.0.0.1:${FIREFLY_HOST_PORT:-8086}
      APP_ENV: local
      APP_DEBUG: "false"
      SITE_OWNER: admin@example.com
      TZ: Europe/Berlin
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${FIREFLY_DB_NAME:-firefly}
      DB_USERNAME: ${FIREFLY_DB_USER:-firefly_app}
      DB_PASSWORD: ${FIREFLY_DB_PASSWORD:-firefly_secure_placeholder_password}
    volumes:
      - firefly_upload:/var/www/html/storage/upload
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ki-basis-net

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: ki-basis-paperless
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PAPERLESS_HOST_PORT:-8010}:8000"
    environment:
      PAPERLESS_REDIS: redis://valkey:6379
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: postgres
      PAPERLESS_DBPORT: 5432
      PAPERLESS_DBNAME: ${PAPERLESS_DB_NAME:-paperless}
      PAPERLESS_DBUSER: ${PAPERLESS_DB_USER:-paperless_app}
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD:-paperless_secure_placeholder_password}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:-paperless_placeholder_secret_key_change_me}
      PAPERLESS_URL: http://127.0.0.1:${PAPERLESS_HOST_PORT:-8010}
      PAPERLESS_TIME_ZONE: Europe/Berlin
      PAPERLESS_OCR_LANGUAGE: deu+eng
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:-admin}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:-AdminSecurePassword123!}
    volumes:
      - paperless_data:/usr/src/paperless/data
      - paperless_media:/usr/src/paperless/media
      - paperless_export:/usr/src/paperless/export
      - paperless_consume:/usr/src/paperless/consume
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "-S", "--max-time", "2", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ki-basis-net

  openproject:
    image: openproject/openproject:14
    container_name: ki-basis-openproject
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPENPROJECT_HOST_PORT:-8082}:80"
    environment:
      OPENPROJECT_HTTPS: "false"
      OPENPROJECT_HOST__NAME: 127.0.0.1:${OPENPROJECT_HOST_PORT:-8082}
      OPENPROJECT_SECRET_KEY_BASE: ${OPENPROJECT_SECRET_KEY_BASE:-openproject_placeholder_secret_key_base_change_me}
      DATABASE_URL: postgres://${OPENPROJECT_DB_USER:-openproject_app}:${OPENPROJECT_DB_PASSWORD:-openproject_secure_placeholder_password}@postgres:5432/${OPENPROJECT_DB_NAME:-openproject}
      PG_STARTUP_WAIT_TIME: "30"
    volumes:
      - openproject_assets:/var/openproject/assets
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ki-basis-net

  nginx:
    image: nginx:1.27-alpine
    container_name: ki-basis-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NGINX_HOST_PORT:-8084}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - firefly
      - paperless
      - openproject
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - ki-basis-net

  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: ki-basis-hermes
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HERMES_DASHBOARD_HOST_PORT:-8642}:8642"
      - "127.0.0.1:${HERMES_GATEWAY_HOST_PORT:-9119}:9119"
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_GATEWAY_EXTERNAL_SUPERVISOR: "1"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-admin}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-hermes_secure_placeholder_password}
      HERMES_HOME: /opt/data
      HERMES_WRITE_SAFE_ROOT: /opt/data
      HERMES_DISABLE_LAZY_INSTALLS: "1"
      HERMES_LAZY_INSTALL_TARGET: /opt/data/lazy-packages
      FIREFLY_API_URL: http://firefly:8080
      PAPERLESS_API_URL: http://paperless:8000
      OPENPROJECT_API_URL: http://openproject:80
    volumes:
      - /root/.hermes:/opt/data
      - /root/workspaces:/root/workspaces
    depends_on:
      - firefly
      - paperless
      - openproject
      - nginx
    networks:
      - ki-basis-net
