schema_version: 2
record_type: independent_preimplementation_risk_gap_register
program: hermes-multi-repo-orchestration-v2
evaluation_date: 2026-08-24
verdict: REVISE
prior_review_commit: 49b716a21ee82b94fcd26a6adac7bb2809ad2303
evidence_labels:
  - EXECUTED
  - STATIC_SIMULATION
  - SOURCE_VERIFIED
  - INFERENCE
scope_note: >-
  This register supplements the architecture risk register for the independent
  pre-implementation review only. It does not mutate D01-D10 or authorize D10.

risks:
  - id: IPV-R21
    title: Legacy static MasterOfArts Docker mount reused across repositories
    severity: critical
    likelihood: high_if_pilot_config_reused
    evidence_label: SOURCE_VERIFIED
    evidence:
      - MasterOfArts implementation-evidence/P07-hermes-docker-backend.md
      - MasterOfArts Orchestration/Implementation/OKF-EXECUTION-OBSERVATIONS.yaml
      - Hermes issue 91568
      - Hermes issue 83856
    scenario: >-
      A non-MasterOfArts task launches with /root/MasterOfArts still bound to
      /workspace, or its task path is not an actual host-backed workspace.
    consequence:
      - wrong-repository writes
      - data exposure across projects
      - ephemeral false-success commits
    mitigation: C01
    acceptance: >-
      For each repository, pre-command diagnostics prove the exact authorized
      host workspace -> container workspace mapping, and a disposable host-side
      file/commit persists after worker exit.
    status: open_preimplementation

  - id: IPV-R22
    title: Root-owned pilot paths become multi-repo filesystem convention
    severity: high
    likelihood: medium
    evidence_label: SOURCE_VERIFIED
    evidence:
      - MasterOfArts pilot uses /root/MasterOfArts
      - D07 and migration plan target normal-user ~/workspaces
      - Microsoft WSL filesystem guidance
    scenario: >-
      New repositories are cloned under /root or mixed ownership while roles,
      QMD, Docker and Windows access expect a normal WSL user.
    consequence:
      - permission drift
      - hidden administrative coupling
      - brittle path assumptions
    mitigation: C02
    acceptance: >-
      Canonical paths resolve under the selected normal WSL user's home;
      ownership/UID/GID and required read/write operations pass without sudo.
    status: open_preimplementation

  - id: IPV-R23
    title: Partial or non-atomic Apex rollup publishes false portfolio state
    severity: high
    likelihood: medium
    evidence_label: STATIC_SIMULATION
    evidence:
      - D01 derived-state boundary
      - D02 asynchronous rollup design
    scenario: >-
      One board/repository read fails after other sources were collected and a
      naive script replaces the prior snapshot with an incomplete result.
    consequence:
      - missing work appears complete or absent
      - downstream decisions use a false portfolio view
    mitigation: C03
    acceptance: >-
      All configured sources must validate before atomic replacement; failure
      preserves last-known-good output and emits a degraded receipt.
    status: open_preimplementation

  - id: IPV-R24
    title: Healthy QMD index is stale relative to current Git HEAD
    severity: high
    likelihood: medium
    evidence_label: STATIC_SIMULATION
    evidence:
      - D08 QMD derived-state contract
      - MasterOfArts P08/P09 pilot evidence
    scenario: >-
      Source repo advances after the last QMD refresh; qmd status remains healthy
      and a high-stakes task retrieves prior content.
    consequence:
      - stale decisions
      - plausible but obsolete citations
    mitigation: C04
    acceptance: >-
      Per-collection refresh receipt records source repo/branch/head SHA and
      successful update/embed state; high-stakes query refuses mismatched HEAD.
    status: open_preimplementation

  - id: IPV-R25
    title: Repository default branch mismatch
    severity: medium
    likelihood: low_after_current_state_lock
    evidence_label: SOURCE_VERIFIED
    evidence:
      - apex state.yaml
      - D07
      - migration manifest
      - acim-secular default branch master
      - other managed repos main
    scenario: >-
      A generic script assumes main for acim-secular and reads or updates the
      wrong ref.
    consequence:
      - stale checkout
      - incorrect provenance
    mitigation: existing_authority_acceptance_check
    acceptance: >-
      Every repo operation resolves branch from the managed repository registry;
      no hard-coded global default is allowed.
    status: controlled_by_existing_architecture

  - id: IPV-R26
    title: Reusable role profile carries project schedules or facts across repos
    severity: critical
    likelihood: high_if_pilot_profile_reused
    evidence_label: SOURCE_VERIFIED
    evidence:
      - MasterOfArts Orchestration/Implementation/AUTONOMOUS_LEARNINGS_SUMMARY.md
      - Hermes issue 85497
      - D03 and D04
    scenario: >-
      Existing USER.md/MEMORY.md includes 05:00/06:00/08:00 project milestones
      or other project knowledge and is then reused for Investment or ACIM.
    consequence:
      - semantic contamination
      - unintended background work
      - recurring token waste
    mitigation: C05
    acceptance: >-
      Reusable profile review finds only stable role identity and operator
      preferences; no repository names, task schedules, project facts, fixed cwd
      or project-specific mount configuration remain.
    status: open_preimplementation

  - id: IPV-R27
    title: Global or learned skill copies shadow repository-scoped policy
    severity: high
    likelihood: high_if_pilot_install_reused
    evidence_label: SOURCE_VERIFIED
    evidence:
      - MasterOfArts P11 BMAD global + project install
      - MasterOfArts P12 MarketingSkills global + project install
      - AUTONOMOUS_LEARNINGS_SUMMARY learned-library list
      - BMAD issue 1728 remains open
      - D05 and D06
    scenario: >-
      A profile working in ACIM or Investment discovers global BMAD or
      MarketingSkills even though the target architecture did not authorize them.
    consequence:
      - prompt/routing ambiguity
      - version drift
      - accidental domain-method bleed
    mitigation: C06
    acceptance: >-
      Runtime skill inventory is provenance-labelled and matches the repository
      capability registry; same-name shadowing active copies are rejected.
    status: open_preimplementation

  - id: IPV-R28
    title: Ambient host credentials enter Docker despite filesystem isolation
    severity: critical
    likelihood: medium
    evidence_label: SOURCE_VERIFIED
    evidence:
      - MasterOfArts OKF-EXECUTION-OBSERVATIONS OBS-004
      - D10 security acceptance intent
    scenario: >-
      Sensitive environment variables exported in the Hermes/gateway process are
      inherited by the action container even though unrelated host paths are not mounted.
    consequence:
      - credential exposure
      - cross-project/provider data leak
    mitigation: C07
    acceptance: >-
      Canary environment variables absent from explicit docker_forward_env
      allowlist are not present inside the worker; only named task-required vars pass.
    status: open_preimplementation

  - id: IPV-R29
    title: Repository activation lacks intentional root context/authority entrypoint
    severity: high
    likelihood: high_for_two_repos
    evidence_label: SOURCE_VERIFIED
    evidence:
      - acim-secular root AGENTS.md not found on master
      - Investment root AGENTS.md not found on main
      - Apex root AGENTS.md is Codex/Apex-KB oriented
      - D03/D07/D08 context assumptions
    scenario: >-
      A reusable Hermes profile enters a repository without a concise automatic
      route to current authority and relies on model search or stale memory.
    consequence:
      - context drift
      - unnecessary token loading
      - wrong authority selection
    mitigation: C08
    acceptance: >-
      Before board activation each repository has a validated, upstream-consumed
      root context path (AGENTS or documented equivalent) pointing to current truth
      without copying the truth body.
    status: open_preimplementation

  - id: IPV-R30
    title: Dangling project-board binding reports success
    severity: high
    likelihood: low_to_medium
    evidence_label: SOURCE_VERIFIED
    evidence:
      - Hermes issue 76285 open
    scenario: >-
      A typo or stale board slug is persisted by hermes project bind-board with exit 0.
    consequence:
      - orchestration believes project is connected when no board exists
      - tasks never dispatch as expected
    mitigation: acceptance_test_board_existence
    acceptance: >-
      Preflight independently enumerates board slugs and rejects a configured
      binding not present in the live board registry.
    status: open_acceptance

  - id: IPV-R31
    title: No-agent scheduled job can fail silently
    severity: high
    likelihood: medium_if_no_agent_cron_used
    evidence_label: SOURCE_VERIFIED
    evidence:
      - Hermes issue 20353 open
      - Hermes issues 77131 and 80624 closed
    scenario: >-
      Deterministic harvest/rollup script exits without useful output or swallows
      an exception; scheduler provides no heartbeat and the operator assumes it ran.
    consequence:
      - stale rollups
      - stale skill harvest
      - false automation health
    mitigation: d10_scheduler_acceptance_extension
    acceptance: >-
      Every unattended deterministic job has verifiable last-run/exit/success
      receipt or heartbeat; missing evidence is unhealthy, never success.
    status: blocked_while_d10_disabled

  - id: IPV-R32
    title: Same-profile concurrency bypasses per-board limits
    severity: critical
    likelihood: high_if_d10_enabled_early
    evidence_label: SOURCE_VERIFIED
    evidence:
      - Hermes issue 78122 open
      - Hermes issue 85497 open
    scenario: >-
      Multiple active boards each dispatch a worker for the same reusable profile.
    consequence:
      - shared memory write race
      - SQLite/profile state corruption
      - cross-project contamination
    mitigation: existing_d03_plus_d10_gate
    acceptance: >-
      Safe Mode A proves one process per writable profile; D10 cannot enable until
      an installed-version global profile/concurrency gate passes adversarial tests.
    status: controlled_while_d10_disabled

  - id: IPV-R33
    title: QMD collection omission causes cross-repository retrieval bleed
    severity: high
    likelihood: medium_if_unscoped_queries_allowed
    evidence_label: STATIC_SIMULATION
    evidence:
      - D08 explicit collection design
      - QMD current collections contract
    scenario: >-
      A project task issues unscoped semantic retrieval and receives content from
      another included-by-default collection.
    consequence:
      - factual contamination
      - privacy boundary violation
    mitigation: existing_d08_plus_c04
    acceptance: >-
      Project-heavy task requires explicit allowed collection list and negative
      tests assert unrelated repository paths never appear.
    status: open_live_acceptance

  - id: IPV-R34
    title: Prior execution receipts overclaimed as current live verification
    severity: medium
    likelihood: medium
    evidence_label: SOURCE_VERIFIED
    evidence:
      - prior review commit 49b716a2 labels direct live host observations EXECUTED
      - this independent reviewer had no WSL/Hermes shell access
    scenario: >-
      A future reviewer assumes a repository receipt is proof the current installed
      runtime has not changed and skips current-version validation.
    consequence:
      - stale runtime assumptions
      - incorrect authorization
    mitigation: evidence_discipline
    acceptance: >-
      Durable receipts are cited as evidence of prior execution; current-runtime
      claims require a fresh installed-version receipt or are labelled SOURCE_VERIFIED/INFERENCE.
    status: open_process_guard

