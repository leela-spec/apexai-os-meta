control_plane:
  repository: leela-spec/apexai-os-meta
  role: durable_portfolio_orchestration_control_plane
  accepted: true
  project_content_warehouse: false
  runtime_state_store: false
  owns:
    - portfolio_registry
    - orchestration_architecture_and_ADRs
    - reviewed_role_profile_specifications
    - reviewed_generic_shared_skill_source_after_pilot
    - cross_repo_operating_and_safety_policy
    - cross_project_decisions_and_dependencies
    - derived_portfolio_rollups
    - health_and_freshness_metadata
    - migration_and_orchestration_evidence

managed_repositories:
  apex:
    repository: leela-spec/apexai-os-meta
    default_branch: main
    board_candidate: apex
    qmd_prefix_candidate: apex
  masterofarts:
    repository: leela-spec/MasterOfArts
    default_branch: main
    board_candidate: masterofarts
    qmd_prefix_candidate: moa
  acim:
    repository: leela-spec/acim-secular
    default_branch: master
    board_candidate: acim
    qmd_prefix_candidate: acim
  investment:
    repository: leela-spec/Investment
    default_branch: main
    board_candidate: investment
    qmd_prefix_candidate: investment

runtime_target:
  canonical_workspace_root: "~/workspaces"
  canonical_filesystem: WSL2_linux_filesystem
  windows_access: "\\\\wsl.localhost\\Ubuntu\\home\\<operator>\\workspaces"
  one_hermes_installation: true
  one_qmd_installation: true
  docker_execution_boundary: true
  duplicate_live_windows_wsl_checkouts: false
  safe_mode_initial: sequential_single_repo_execution
  autonomous_multi_board_mode: gated_future_option

implementation_execution:
  executor: Google_Antigravity
  executor_role: bounded_phase_executor_and_verifier
  architecture_dependency_on_executor: false
  implementation_run_uses_executor: true
  implementation_status: not_authorized
  branch_policy: canonical_branch_only_no_branches_or_PRs
  worktrees: forbidden
  existing_control_file_mutation: exact_match_patch_only
  whole_file_rewrite_existing_control_files: forbidden
  new_files_direct_creation: allowed
  context_policy: one_major_phase_per_Antigravity_context
  evidence_policy: one_compact_phase_evidence_file_plus_implementation_state
  upstream_refresh_before_mutation: required
  D10_enablement: separate_explicit_operator_gate

kanban_recommendation:
  status: accepted_2026_08_24
  previous_candidate: one_board_with_repo_tenants
  previous_candidate_status: superseded_by_current_research
  recommended_topology: separate_board_per_repo_plus_async_apex_rollup
  boards:
    - apex
    - masterofarts
    - acim
    - investment
  tenants_as_repo_isolation: forbidden
  source_board_is_authoritative: true
  apex_rollup:
    mode: asynchronous_deterministic_read_only
    realtime_required: false
    bidirectional_sync_initial: false
    source_task_mirroring: false
  cross_board_native_links: unsupported_by_Hermes
  cross_repo_dependency_owner: apex_explicit_reference_or_decision_object
  evidence:
    - Hermes_boards_are_hard_isolation_boundary
    - Hermes_tenants_are_soft_namespaces
    - upstream_issue_85497_tenant_memory_isolation_not_implemented
    - upstream_issue_78122_concurrency_limits_per_board_not_gateway_wide

execution_concurrency:
  same_profile_parallel_processes: forbidden
  same_role_cross_repo: sequential_initially
  one_active_execution_board_at_a_time_initially: true
  all_boards_may_exist_and_be_read: true
  background_gateway_dispatch_initially: false
  reason:
    - official_profiles_warn_against_two_processes_same_profile
    - current_cross_board_concurrency_limit_is_not_gateway_wide

profiles:
  model: durable_roles_reused_across_repositories
  decision_status: accepted_with_constraints_2026_08_24
  repo_specific_profile_copies_by_default: false
  profiles_candidate:
    - portfolio_orchestrator
    - research_strategist
    - independent_reviewer
    - workshop_designer
    - marketing_executive
  constraints:
    - sequential_single_writer_per_profile
    - no_repo_specific_terminal_cwd_for_kanban_workers
    - project_facts_not_in_raw_role_memory
  profile_distributions:
    candidate_use: apex_versioned_role_spec_and_common_MCP_config
    production_status: acceptance_test_required
    must_preserve_local:
      - memories
      - sessions
      - auth
      - env_secrets
      - runtime_state

learning:
  decision_status: accepted_with_constraints_2026_08_24
  raw_memory_scope: profile_local
  project_facts_scope: source_repository
  source_task_state_scope: source_repo_board
  same_role_cross_repo_learning: sequential_profile_reuse
  cross_agent_spillover: reviewed_generic_Agent_Skill_promotion
  raw_memory_sync: forbidden
  automatic_unreviewed_promotion: forbidden
  delayed_sync_allowed: true
  candidate_harvest:
    desired_mode: deterministic_script
    provider_model_calls: 0
    schedule_candidate: daily_or_end_of_execution_batch
  semantic_review:
    runs_only_when_candidates_change: true
    reviewer_candidate: independent_reviewer
  canonical_shared_source:
    owner_candidate: apexai-os-meta
    production_path: not_locked_until_pilot
    routine_self_improvement_write_access: forbidden
  external_shared_memory: deferred

skills:
  generic_shared:
    decision_status: accepted_direction_pilot_required
    format_candidate: Agent_Skills
    apex_role: reviewed_versioned_canonical_source_after_pilot
  project_specific:
    owner: source_repository
    distribution_to_other_repos: false_by_default
  marketing_skills:
    current_scope: MasterOfArts_only
    global_install: false
    other_repo_install: only_on_future_real_need
  bmad:
    placement: repo_local_where_used
    global_single_install_proven: false
    global_link_issue: upstream_open_proposal_1728
    custom_global_linker: forbidden
  apex_kb:
    scope: Apex_only
    current_authority_path: .claude/skills/apex-kb/SKILL.md
    cross_client_interop: implementation_gate
    duplicate_drifting_copies: forbidden

qmd:
  decision_status: accepted_research_verified_live_acceptance_pending
  one_local_engine: true
  collection_registry: machine_local
  collections_cross_repo: curated_named_collections
  cwd_independent_collection_selection: verified
  profile_connection_rule: each_Hermes_profile_that_needs_QMD_requires_MCP_declaration
  routine_project_query: explicit_repo_collections
  portfolio_query: explicit_selected_control_collections
  unscoped_whole_estate_collection: forbidden
  large_project_collections_default_included: false
  MCP_collection_field: collections_plural
  singular_collection_field: forbidden_silently_ignored_current_QMD
  project_truth_owner: repositories
  index_is_canonical: false
  profile_distribution_for_MCP: candidate_acceptance_test_required
  project_local_QMD_config:
    default_preference: machine_owned_global_registry_for_multi_repo_map
    unreviewed_update_hooks: forbidden
    installed_version_trust_behavior_recheck_required: true

filesystem:
  decision_status: accepted_research_verified_migration_pending
  target: single_WSL_canonical_checkout_per_managed_repo
  evidence:
    - Microsoft_WSL_filesystem_guidance
    - Microsoft_current_WSL_interop_9P_guidance
    - Docker_WSL_source_location_guidance
  target_layout:
    - "~/workspaces/apexai-os-meta"
    - "~/workspaces/MasterOfArts"
    - "~/workspaces/acim-secular"
    - "~/workspaces/Investment"
  migration_method: per_repo_inventory_compare_reconcile_verify_freeze_old_copy
  delete_old_windows_copy_automatically: false
  bidirectional_sync_long_term: forbidden
  normal_wsl_user_preferred_over_root: true

sandbox:
  backend: Hermes_official_Docker
  direct_sequential_repo_execution: initial_target
  background_kanban_worker_dispatch: blocked_until_acceptance
  current_upstream_risks:
    - issue_73556_profile_cwd_can_broaden_task_mount
    - issue_83856_host_container_cwd_provenance_mismatch
    - issue_91568_kanban_worker_workspace_may_not_be_host_backed
  required_acceptance:
    - intended_repo_readable
    - disposable_write_persists_host_side
    - disposable_git_commit_persists_host_side
    - unrelated_host_paths_inaccessible
    - Docker_socket_not_exposed
    - secrets_not_unintentionally_forwarded
    - terminal_file_execute_code_same_workspace
    - role_profile_no_fixed_repo_cwd_override

