disqualified:
  - name: "Agency Swarm"
    failed_gates: ["H7", "H8"]
    rationale: "Tightly coupled exclusively to OpenAI Assistants API threads; requires pay-per-token API calls for all operations; lacks multi-executor portability."
  - name: "MetaGPT"
    failed_gates: ["H10"]
    rationale: "Rigidly hardcoded around software company roles (Architect, Engineer, QA) and SOPs; lacks extensible business/workshop/coaching workflows."
  - name: "LangGraph (as standalone complete OS)"
    failed_gates: ["H3", "H4"]
    rationale: "A low-level programmatic orchestration SDK, not an off-the-shelf agent operating organization; requires building all 10 layers and all specialist roles from scratch in Python."
  - name: "AutoGen / AG2 (as standalone complete OS)"
    failed_gates: ["H3", "H4", "H10"]
    rationale: "Conversational agent SDK; lacks prebuilt business specialist libraries, portfolio SSOT, and native document knowledge promotion without extensive custom coding."
  - name: "CrewAI (as standalone complete OS)"
    failed_gates: ["H7", "H8", "H11"]
    rationale: "Python framework requiring custom persistence backend (Postgres/Enterprise) for durable portfolio state; weak integration with CLI subscription agents (Claude Code / Codex / Antigravity) without wrapping them in API proxies."
  - name: "Gas City"
    failed_gates: ["H10", "H11"]
    rationale: "Designed exclusively for multi-agent software coding factories; high operational complexity (SDK + Dolt + packs); no verified non-software business case studies."
  - name: "Letta / MemGPT"
    failed_gates: ["H11", "H2"]
    rationale: "Stateful agent memory server requiring dedicated daemon/database infrastructure; heavy operational footprint for a solo operator without providing portfolio SSOT or workflow engine."

