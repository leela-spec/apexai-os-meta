    reason: "Visual agent/RAG runtime is useful but does not supply enough proven specialist/portfolio organization out of the box."
  - candidate: "AutoGen as complete MoA system"
    reason: "Strong agent-team framework but would require substantial custom operating organization."
  - candidate: "Letta as complete MoA system"
    reason: "Excellent stateful memory-agent component but not a complete portfolio/workflow/specialist organization."
