    reason: "Excellent L3/L4/L9 component with durable workflows and gates; lacks integrated semantic KB and broad specialist-agent organization."
  - candidate: "BMAD standalone as complete MoA system"
    reason: "Excellent L4/L5 donor but lacks durable runtime/portfolio/semantic-KB ownership."
  - candidate: "Beads as complete MoA system"
    reason: "Excellent agent task graph but not a corpus KB or specialist organization; coding-agent bias remains."
  - candidate: "OpenSpec as complete MoA system"
    reason: "Strong change/spec artifact lifecycle, not a whole agent operating organization."
  - candidate: "Task Master as complete MoA system"
    reason: "Strong task decomposition, but development/PRD centered and incomplete on knowledge/governance/specialists."
  - candidate: "Superpowers as complete MoA system"
    reason: "Excellent process/reviewer donor but not portfolio state, KB or general runtime."
  - candidate: "GitHub Issues/Projects + Agent Skills as complete MoA system"
    reason: "Excellent human-visible control and portability boundary, but no first-class semantic KB or AI workflow runtime."
