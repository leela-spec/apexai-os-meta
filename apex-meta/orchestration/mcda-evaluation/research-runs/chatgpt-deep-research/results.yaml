    reason: "Strong agents, task mode, knowledge and HITL, but no sufficiently mature reusable specialist/workflow ecosystem to avoid authoring most MoA organization logic."
  - candidate: "CrewAI as complete MoA system"
    reason: "Capable crews/flows/knowledge, but H3/H4 would require substantial custom role/workflow authoring."
